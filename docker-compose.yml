services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudstore}
      POSTGRES_USER: ${POSTGRES_USER:-cloudstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes: [postgres_data:/var/lib/postgresql/data, ./database/migrations:/docker-entrypoint-initdb.d:ro]
    # 5432 is commonly occupied by a host PostgreSQL installation.
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudstore}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cloudstore}
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /storage
    ports: ["4000:4000"]
    volumes:
      - ./storage:/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://localhost:4000/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
